name: Build and Push to Docker Hub

# Triggers the workflow every time a push or merge happens on the main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download your repository's code
      - name: Check out code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (enables modern build features)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Authenticate with Docker Hub using your secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Build the image from your Dockerfile and push it to Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Replace 'your-username' and 'your-repo-name' with your actual Docker Hub details
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/letslearnit:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/letslearnit:${{ github.sha }}
